name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: test "$(npm --version)" = '11.17.0'
      - run: make install
      - name: One production build, source and anonymous checks
        run: make ci-check
      - run: python3 deploy/tests/config-static.py && python3 deploy/tests/beta-tools.py && python3 deploy/tests/release-tools.py
      - run: python3 scripts/check/public-tree.py
      - run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.runtime/cache/playwright" npm --prefix web exec -- playwright install --with-deps chromium
      - name: Existing anonymous production browser and process checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/cache/playwright
          NO_PROXY: localhost,127.0.0.1
        run: |
          node scripts/test/foundation-smoke.mjs
          node scripts/test/metadata-smoke.mjs
          npm --prefix web run test:e2e
      - run: git diff --check
