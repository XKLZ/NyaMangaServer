      "post": {
        "operationId": "pagedTagSuggestions",
        "summary": "Rank local effective tags and the downloaded dictionary without network access",
        "tags": [
          "Metadata"
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
