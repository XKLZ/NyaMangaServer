    "/maintenance/plans": {
      "post": {
        "operationId": "previewMaintenance",
        "summary": "previewMaintenance",
        "description": "Only operation=cleanup, after authentication, CSRF and ordinary-deadline JSON decoding, uses a finite 30-minute bulk preview deadline (including socket writes). Client disconnect/cancellation and a shorter upstream deadline still cancel it. Other operations keep the ordinary 30-second deadline. Cleanup walks once for statistics and the frozen selection, hashes only selected files (at most 100000 files and 1 TiB); polling storage statistics never hashes candidates. Returns the existing plan synchronously; no deletion occurs until explicit execute. Client should show cancellable pending state, retain choices, avoid automatic duplicate previews, and allow up to 30 minutes plus response overhead. 504 request_timeout stops preview, 422 cleanup_preview_capacity requires a smaller selection. Plan expires 30 minutes after it is created, not after preview starts.",
        "tags": [
          "Maintenance"
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaintenancePlan"
                }
              }
            }
          },
          "default": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MaintenancePlanInput"
              }
            }
          }
        }
      }
    },
