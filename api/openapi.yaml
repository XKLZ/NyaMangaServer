{
  "openapi": "3.1.0",
  "info": {
    "title": "NyaMangaServer API",
    "version": "0.7.0-beta.1",
    "description": "Authenticated management, read-only ingestion, metadata, organization, persistent tasks and reversible index maintenance. Whole-instance credential-bearing backup/restore requires identical build and ledger. Full reader remains future work."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "tags": [
    {
      "name": "Authentication",
      "description": "Account sessions and administrator account management"
    },
    {
      "name": "System",
      "description": "Configuration and health"
    },
    {
      "name": "Catalog",
      "description": "Libraries, scanning and physical book indexes"
    },
    {
      "name": "Metadata",
      "description": "User initiated metadata and translation workflows"
    },
    {
      "name": "Organization",
      "description": "Organization management"
    },
    {
      "name": "Administration",
      "description": "Administration management"
    },
    {
      "name": "Maintenance",
      "description": "Maintenance management"
    },
    {
      "name": "WorkRecommendations",
      "description": "Optional local V4 Work recommendations, human confirmation and isolated pilot feedback"
    },
    {
      "name": "TagManagement",
      "description": "Explicit-library tag catalog and globally shared human parody/character decisions"
    }
  ],
  "security": [
    {
      "SessionCookie": []
    }
  ],
