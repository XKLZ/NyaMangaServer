    "/tag-catalog/{id}/works": {
      "get": {
        "operationId": "tagCatalogWorks",
        "summary": "List distinct Works using a tag in an explicit library",
        "tags": [
          "TagManagement"
        ],
        "description": "Filter eligible non-trashed tagged Editions before Work grouping, count and pagination, in one read transaction. Includes hidden, missing/corrupt and explicitly disabled-library material; rejects trashed libraries. q matches the effective Work name OR effective titles of only eligible Editions using this tag. Names follow manual/preferred inheritance. Cover uses the preferred Edition even without this tag, or the stable lowest-ID non-trashed member when the preferred is trashed. Does not open archives, render images, combine member metadata, or infer relationships. Only sort=name is supported; reject category, namespace, include_unused=true, view, related_tag_id, or any explicit partition. Page > 1 requires this endpoint's snapshot, which expires on query/library/catalog/organization/translation or cover-selection changes; Edition/detail snapshots cannot be reused. 关系参数view、partition、related_tag_id（含空值／partition=all）均不属于本接口，返回400。",
