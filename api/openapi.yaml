    "/events": {
      "get": {
        "operationId": "streamEvents",
        "summary": "streamEvents",
        "tags": [
          "Metadata"
        ],
        "parameters": [
          {
            "name": "Last-Event-ID",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Authenticated SSE, 15 second heartbeat, retained 24h / 10000 events. Last-Event-ID replays notifications; resync_required requests a fresh resource query. No business payload or secrets. Streaming write deadlines replace normal request deadlines. tag_follow events are private: owner filtering happens in server SQL before LIMIT. Existing global events remain visible. Owner identity never appears in payload. Retention and gaps use the entire event log, not filtered IDs; filtered-only batches advance the internal cursor to the read transaction high-water mark without false resync. Full visible batches continue at their last event ID. Reconnect uses Last-Event-ID and retained-log gap resync as before."
      }
    },
