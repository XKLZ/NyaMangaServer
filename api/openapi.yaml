            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "default": {
            "description": "Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TagSuggestions"
                }
              }
            }
          },
          "409": {
            "description": "tag_suggestions_snapshot_expired; query page one again",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TagSuggestionInput"
              }
            }
          }
        },
        "description": " Authenticated local tag follows rank first, then existing usage DESC, local-first and normalized stable keys. Exclusion/query/count/paging remain SQL. Candidates include followed/follow_revision; dictionary-only has false/0 and cannot be followed until a real tag exists. Snapshot binds account and only its follow epoch; follow ABA expires old pages. No account_id input accepted."
      }
    },
