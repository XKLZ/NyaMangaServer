# Isolated test deployment. Prepare configuration with prepare-beta.py first.
name: nyamangaserver-beta
services:
  server:
    image: ${NYAMANGA_IMAGE:?set exact delivered image tag}
    platform: linux/amd64
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "${NYAMANGA_PORT:-19400}:9400"
    volumes:
      - app-data:/data
      - provider-secrets:/secrets
      - models:/models:ro
      - anonymous-library:/library/comics:ro
      - type: bind
        source: ${NYAMANGA_BETA_DIR:?set explicit isolated directory}/server.json
        target: /run/config/server.json
        read_only: true
      - type: bind
        source: ${NYAMANGA_BETA_DIR:?set explicit isolated directory}/setup-token
        target: /run/secrets/setup_token
        read_only: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/server", "--healthcheck", "http://127.0.0.1:9400/api/v1/health/ready"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
volumes:
  app-data:
  provider-secrets:
  models:
  anonymous-library:
